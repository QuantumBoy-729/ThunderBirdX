<html:template id="paneAppearance">
  <hbox id="appearanceCategory"
        class="subcategory"
        data-category="paneAppearance">
    <html:h1 data-l10n-id="appearance-category-header"/>
  </hbox>

  <!-- Overhaul (personal fork): ThunderBirdX appearance options. -->
  <html:fieldset id="overhaulGroup" data-category="paneAppearance">
    <html:legend data-l10n-id="overhaul-legend"></html:legend>
    <checkbox id="overhaulEnabled"
              data-l10n-id="overhaul-enabled"
              preference="mail.overhaul.enabled"/>
    <html:div id="overhaulOptions" class="indent overhaul-options">
      <label data-l10n-id="overhaul-theme" control="overhaulTheme"/>
      <menulist id="overhaulTheme" preference="mail.overhaul.theme">
        <menupopup>
          <menuitem value="default" data-l10n-id="overhaul-theme-default"/>
          <menuitem value="ocean" data-l10n-id="overhaul-theme-ocean"/>
          <menuitem value="forest" data-l10n-id="overhaul-theme-forest"/>
          <menuitem value="sunset" data-l10n-id="overhaul-theme-sunset"/>
          <menuitem value="graphite" data-l10n-id="overhaul-theme-graphite"/>
        </menupopup>
      </menulist>

      <label data-l10n-id="overhaul-corners" control="overhaulCorners"/>
      <menulist id="overhaulCorners" preference="mail.overhaul.corners">
        <menupopup>
          <menuitem value="sharp" data-l10n-id="overhaul-corners-sharp"/>
          <menuitem value="soft" data-l10n-id="overhaul-corners-soft"/>
          <menuitem value="round" data-l10n-id="overhaul-corners-round"/>
        </menupopup>
      </menulist>

      <label data-l10n-id="overhaul-rail" control="overhaulRail"/>
      <menulist id="overhaulRail" preference="mail.overhaul.rail">
        <menupopup>
          <menuitem value="wide" data-l10n-id="overhaul-rail-wide"/>
          <menuitem value="slim" data-l10n-id="overhaul-rail-slim"/>
        </menupopup>
      </menulist>

      <label data-l10n-id="overhaul-background" control="overhaulBackground"/>
      <hbox align="center">
        <menulist id="overhaulBackground" preference="mail.overhaul.background">
          <menupopup>
            <menuitem value="none" data-l10n-id="overhaul-background-none"/>
            <menuitem value="aurora" data-l10n-id="overhaul-background-aurora"/>
            <menuitem value="dusk" data-l10n-id="overhaul-background-dusk"/>
            <menuitem value="meadow" data-l10n-id="overhaul-background-meadow"/>
            <menuitem value="midnight" data-l10n-id="overhaul-background-midnight"/>
            <menuitem value="custom" data-l10n-id="overhaul-background-custom"/>
          </menupopup>
        </menulist>
        <button is="highlightable-button" id="overhaulBackgroundChoose"
                data-l10n-id="overhaul-background-choose"/>
      </hbox>

      <label data-l10n-id="overhaul-background-dim" control="overhaulBackgroundDim"/>
      <hbox align="center">
        <menulist id="overhaulBackgroundDim" preference="mail.overhaul.background.dim">
          <menupopup>
            <menuitem value="none" data-l10n-id="overhaul-background-dim-none"/>
            <menuitem value="light" data-l10n-id="overhaul-background-dim-light"/>
            <menuitem value="medium" data-l10n-id="overhaul-background-dim-medium"/>
            <menuitem value="strong" data-l10n-id="overhaul-background-dim-strong"/>
          </menupopup>
        </menulist>
        <checkbox id="overhaulBackgroundBlur"
                  data-l10n-id="overhaul-background-blur"
                  preference="mail.overhaul.background.blur"/>
      </hbox>

      <label data-l10n-id="overhaul-sound" control="overhaulSound"/>
      <hbox align="center">
        <menulist id="overhaulSound" preference="mail.overhaul.sound">
          <menupopup>
            <menuitem value="" data-l10n-id="overhaul-sound-general"/>
            <menuitem value="chime" data-l10n-id="overhaul-sound-chime"/>
            <menuitem value="pop" data-l10n-id="overhaul-sound-pop"/>
            <menuitem value="bell" data-l10n-id="overhaul-sound-bell"/>
            <menuitem value="soft" data-l10n-id="overhaul-sound-soft"/>
          </menupopup>
        </menulist>
        <button is="highlightable-button" id="overhaulSoundPreview"
                data-l10n-id="overhaul-sound-preview"/>
      </hbox>

      <label data-l10n-id="overhaul-sender-names" control="overhaulSenderNames"/>
      <menulist id="overhaulSenderNames" preference="mail.addressDisplayFormat">
        <menupopup>
          <menuitem value="2" data-l10n-id="overhaul-sender-names-name"/>
          <menuitem value="0" data-l10n-id="overhaul-sender-names-full"/>
          <menuitem value="1" data-l10n-id="overhaul-sender-names-email"/>
        </menupopup>
      </menulist>

      <html:div class="overhaul-checkboxes">
        <checkbox id="overhaulPreview"
                  data-l10n-id="overhaul-preview"
                  preference="mail.overhaul.preview"/>
        <checkbox id="overhaulAvatars"
                  data-l10n-id="overhaul-avatars"
                  preference="mail.overhaul.avatars"/>
        <checkbox id="overhaulUnreadBar"
                  data-l10n-id="overhaul-unread-bar"
                  preference="mail.overhaul.unread_bar"/>
      </html:div>

      <!-- Updates apply with either look, so these stay enabled. -->
      <label data-l10n-id="overhaul-updates" control="overhaulUpdateAuto"/>
      <hbox align="center" class="overhaul-update-controls">
        <checkbox id="overhaulUpdateAuto"
                  class="overhaul-always-enabled"
                  data-l10n-id="overhaul-updates-auto"
                  preference="mail.thunderbirdx.update.autoCheck"/>
        <button id="overhaulUpdateCheck"
                class="overhaul-always-enabled"
                data-l10n-id="overhaul-updates-check"/>
      </hbox>
      <hbox id="overhaulUpdateStatusRow" class="overhaul-update-status" align="center" hidden="true">
        <description id="overhaulUpdateStatus" aria-live="polite"/>
        <button id="overhaulUpdateDownload"
                class="overhaul-always-enabled"
                data-l10n-id="overhaul-updates-download"
                hidden="true"/>
      </hbox>
    </html:div>
  </html:fieldset>

  <html:fieldset id="colorGroup" data-category="paneAppearance">
    <html:legend data-l10n-id="accent-color-legend"></html:legend>
    <hbox align="center" pack="start">
      <label data-l10n-id="accent-color-selection-label"
             control="accentColor"/>
      <hbox flex="1">
        <menulist id="accentColor" preference="mail.appearance.accentColor">
          <menupopup native="false">
            <menuitem value="accent-color" class="accent-color-os"
                      data-l10n-id="accent-color-os"/>
            <menuitem value="thunderbird" class="accent-color-thunderbird"
                      data-l10n-id="accent-color-thunderbird"/>
            <menuitem value="purple" class="accent-color-purple"
                      data-l10n-id="accent-color-purple"/>
            <menuitem value="orange" class="accent-color-orange"
                      data-l10n-id="accent-color-orange"/>
            <menuitem value="pink" class="accent-color-pink"
                      data-l10n-id="accent-color-pink"/>
            <menuitem value="ink" class="accent-color-ink"
                      data-l10n-id="accent-color-ink"/>
            <menuitem value="teal" class="accent-color-teal"
                      data-l10n-id="accent-color-teal"/>
          </menupopup>
        </menulist>
      </hbox>
    </hbox>
    <description id="accentColorDisabledDescription"
                 data-l10n-id="accent-color-disabled-description"
                 class="tip-caption"/>
  </html:fieldset>

  <html:fieldset id="layoutGroup" data-category="paneAppearance">
    <html:legend data-l10n-id="window-layout-legend"></html:legend>
    <hbox>
      <vbox>
        <checkbox id="drawInTitlebar"
                  data-l10n-id="hide-titlebar-label"
                  preference="mail.tabs.drawInTitlebar"/>
        <description class="indent tip-caption"
                    data-l10n-id="hide-titlebar-description" />
      </vbox>
    </hbox>
    <hbox>
      <vbox>
        <checkbox id="autoHideTabbar"
                  data-l10n-id="hide-tabbar-single-tab-label"
                  preference="mail.tabs.autoHide"/>
        <description data-l10n-id="auto-hide-tabbar-second-tab-description"
                     class="tip-caption indent"/>
      </vbox>
    </hbox>
  </html:fieldset>

#ifdef NIGHTLY_BUILD
  <html:div
    class="settings-callout"
    data-category="paneAppearance"
    data-experimental-features-link="true"
  >
    <html:h2 class="settings-callout-title">
      <html:span data-l10n-id="conversation-view-legend"></html:span>
      <html:span
        class="badge experimental"
        data-l10n-id="conversation-view-beta-badge"
      ></html:span>
    </html:h2>
    <html:p
      class="settings-callout-description"
      data-l10n-id="conversation-view-callout-description"
    ></html:p>
    <html:a
      id="conversationViewSettingsLink"
      class="settings-callout-link"
      href="#betaFeatures-conversationView"
    >
      <html:span data-l10n-id="conversation-view-try-beta-link"></html:span>
      <html:img class="settings-callout-arrow" alt="" />
    </html:a>
  </html:div>
#endif

  <html:fieldset data-category="paneAppearance">
    <html:legend data-l10n-id="default-message-list-legend"></html:legend>
    <separator class="thin"/>

    <label control="appearanceViewStyle"
           data-l10n-id="appearance-view-style-select"/>
    <radiogroup id="appearanceViewStyle"
                class="indent appearance-options"
                preference="mail.threadpane.listview">
      <radio id="appearanceStyleCards"
             value="0"
             data-l10n-id="appearance-radio-card-view" />
      <radio id="appearanceStyleTable"
             value="1"
             data-l10n-id="appearance-radio-table" />
    </radiogroup>

    <separator/>

    <html:div id="cardsViewOptions" hidden="hidden">
      <html:legend data-l10n-id="card-view-options-legend"></html:legend>
      <separator class="thin"/>
      <label control="appearanceCardRows" data-l10n-id="appearance-card-rows" />

      <radiogroup id="appearanceCardRows"
                  class="indent"
                  preference="mail.threadpane.cardsview.rowcount">
        <radio id="cardStyle2Rows"
               value="2"
               data-l10n-id="appearance-card-style-2" />
        <radio id="cardStyle3Rows"
               value="3"
               data-l10n-id="appearance-card-style-3" />
      </radiogroup>
    </html:div>

    <html:div id="tableViewOptions" hidden="hidden">
      <html:legend data-l10n-id="table-view-legend"></html:legend>
      <separator class="thin"/>
      <hbox>
        <checkbox id="tableHorizontalScroll"
                  data-l10n-id="table-layout-horizontal-scroll-label"
                  preference="mail.threadpane.table.horizontal_scroll"/>
      </hbox>
    </html:div>
  </html:fieldset>

  <html:div data-category="paneAppearance">
    <vbox id="appearance-notifications">
      <!-- notificationbox will be added here lazily. -->
    </vbox>

    <html:fieldset>
      <html:legend data-l10n-id="default-message-list-sorting-legend"></html:legend>
      <description flex="1" data-l10n-id="default-message-list-new-folders-description"/>

      <separator/>

      <label control="defaultViewFlags" data-l10n-id="default-flag-label" />
      <radiogroup id="defaultViewFlags"
                  class="indent appearance-options"
                  preference="mailnews.default_view_flags">
        <radio id="defaultFlagUnthreaded"
               value="0"
               data-l10n-id="default-flag-unthreaded" />
        <radio id="defaultFlagThreaded"
               value="1"
               data-l10n-id="default-flag-threaded" />
        <radio id="defaultFlagGrouped"
               value="64"
               data-l10n-id="default-flag-grouped" />
      </radiogroup>

      <separator class="thin"/>

      <html:div class="pane-appearance-sorting-options">
        <label control="defaultSortType" data-l10n-id="default-sort-by-label" />
        <menulist id="defaultSortType" preference="mailnews.default_sort_type">
          <menupopup>
            <menuitem value="18" data-l10n-id="default-sort-date"/>
            <menuitem value="19" data-l10n-id="default-sort-subject"/>
            <menuitem value="20" data-l10n-id="default-sort-from"/>
            <menuitem value="21" data-l10n-id="default-sort-id"/>
            <menuitem value="22" data-l10n-id="default-sort-thread"/>
            <menuitem value="23" data-l10n-id="default-sort-priority"/>
            <menuitem value="24" data-l10n-id="default-sort-status"/>
            <menuitem value="25" data-l10n-id="default-sort-size"/>
            <menuitem value="26" data-l10n-id="default-sort-star"/>
            <menuitem value="27" data-l10n-id="default-sort-unread"/>
            <menuitem value="28" data-l10n-id="default-sort-recipient"/>
            <menuitem value="29" data-l10n-id="default-sort-location"/>
            <menuitem value="30" data-l10n-id="default-sort-tags"/>
            <menuitem value="31" data-l10n-id="default-sort-spam"/>
            <menuitem value="32" data-l10n-id="default-sort-attachments"/>
            <menuitem value="33" data-l10n-id="default-sort-account"/>
            <menuitem value="35" data-l10n-id="default-sort-received"/>
            <menuitem value="36" data-l10n-id="default-sort-correspondents"/>
          </menupopup>
        </menulist>
        <separator/>
      </html:div>

      <label control="defaultSortOrder" data-l10n-id="default-order-label" />
      <radiogroup id="defaultSortOrder"
                  class="indent"
                  preference="mailnews.default_sort_order">
        <radio id="defaultSortOrderAscending"
               value="1"
               data-l10n-id="default-sort-newest-bottom" />
        <radio id="defaultSortOrderDescending"
               value="2"
               data-l10n-id="default-sort-new-messages-top" />
      </radiogroup>

      <html:div class="pane-appearance-sorting-buttons">
        <html:span data-l10n-id="apply-view-settings-label"></html:span>
        <button is="highlightable-button" id="applyAll"
                data-l10n-id="apply-view-settings-to-all-folders-button"></button>
        <button is="highlightable-button" id="applyChoose"
                class="folder-chooser-popup-button"
                data-l10n-id="select-apply-sort-folders-button"></button>
        <menupopup id="folderPickerMenuPopup" class="menupopup">
          <menu id="applyViewToFolder"
                class="apply-view-to-folder-menu"
                data-l10n-id="apply-current-view-to-folder">
            <menupopup is="folder-menupopup"
                       class="menupopup"
                       mode="filing"
                       showFileHereLabel="true"
                       position="start_before"></menupopup>
          </menu>
          <menu id="applyViewToFolderAndChildren"
                class="apply-view-to-folder-and-children-menu"
                data-l10n-id="apply-current-view-to-folder-children">
            <menupopup is="folder-menupopup"
                       class="menupopup"
                       mode="filing"
                       showFileHereLabel="true"
                       showAccountsFileHere="true"
                       position="start_before"></menupopup>
          </menu>
        </menupopup>
      </html:div>
    </html:fieldset>
  </html:div>
</html:template>
